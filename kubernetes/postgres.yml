apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polar-postgres
  template:
    metadata:
      labels:
        app: polar-postgres
    spec:
      containers:
        - name: polar-postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: polardb_catalog
---
apiVersion: v1
kind: Service
metadata:
  name: polar-postgres
spec:
  selector:
    app: polar-postgres
  ports:
    - port: 5432
      targetPort: 5432